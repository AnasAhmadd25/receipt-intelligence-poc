[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-intelligence-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.20", "pillow>=11,<13", "psutil>=6,<8", "rapidfuzz>=3,<4", "scipy>=1.14,<2"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0,<3"]
ocr = ["pytesseract>=0.3.13", "paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4"]
modal = ["modal>=1,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app", "benchmark", "deploy"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
